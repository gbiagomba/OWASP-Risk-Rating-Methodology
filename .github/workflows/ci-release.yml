# .github/workflows/ci-release.yml
#
# Push to any branch runs the build, lint and test gate. A tag matching `v*`
# additionally cross-compiles the ARM64 targets and publishes a GitHub release
# with every platform binary and its SHA256 checksum.
#
# Release notes come from the matching `## [X.Y.Z]` section of CHANGELOG.md,
# falling back to the annotated tag message.
#
# Publishing to Docker Hub is opt-in: set the repository variable
# PUBLISH_DOCKER to "true" once DOCKER_USERNAME and DOCKER_PASSWORD secrets
# exist.

name: CI and Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'

env:
  PROJECT_TYPE: rust
  BINARY_NAME: riskforge
  PYTHON_PACKAGE_NAME: riskforge

jobs:
  build-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x64
          - os: macos-15-intel
            asset: macos-x64
          - os: macos-14
            asset: macos-aarch64
          - os: windows-latest
            asset: windows-x64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # RUST TOOLCHAIN + CI PATH
      - name: Set up Rust
        if: env.PROJECT_TYPE == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: env.PROJECT_TYPE == 'rust'
        uses: swatinem/rust-cache@v2

      - name: Rust Format (cargo fmt)
        if: env.PROJECT_TYPE == 'rust'
        run: cargo fmt --all -- --check

      - name: Rust Lints (cargo clippy)
        if: env.PROJECT_TYPE == 'rust'
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust Build (release)
        if: env.PROJECT_TYPE == 'rust'
        run: cargo build --release

      - name: Rust Tests
        if: env.PROJECT_TYPE == 'rust'
        run: cargo test --all --no-fail-fast

      - name: Name the Rust binary for release
        if: env.PROJECT_TYPE == 'rust' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          src="target/release/${BINARY_NAME}"
          [ -f "$src" ] || src="target/release/${BINARY_NAME}.exe"
          cp "$src" "${BINARY_NAME}-${{ matrix.asset }}"

      - name: Upload Rust binary artifact
        if: env.PROJECT_TYPE == 'rust' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.asset }}
          path: ${{ env.BINARY_NAME }}-${{ matrix.asset }}
          if-no-files-found: error

      # PYTHON TOOLCHAIN + CI PATH
      - name: Set up Python
        if: env.PROJECT_TYPE == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install Python dependencies
        if: env.PROJECT_TYPE == 'python'
        run: |
          if [ -f "requirements-dev.txt" ]; then
            pip install -r requirements-dev.txt
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

      - name: Python Lint/Format (optional placeholder)
        if: env.PROJECT_TYPE == 'python'
        run: |
          echo "Add flake8/black/ruff/mypy here if desired"

      - name: Python Tests
        if: env.PROJECT_TYPE == 'python'
        run: |
          if [ -d "tests" ]; then
            pip install pytest
            pytest
          else
            echo "No tests/ directory found; skipping pytest."
          fi

      - name: Build Python package
        if: env.PROJECT_TYPE == 'python' && startsWith(github.ref, 'refs/tags/v')
        run: |
          pip install build
          python -m build
        env:
          PYTHON_PACKAGE_NAME: ${{ env.PYTHON_PACKAGE_NAME }}

      - name: Upload Python package artifacts
        if: env.PROJECT_TYPE == 'python' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PYTHON_PACKAGE_NAME }}-dist
          path: dist/*

  # RUST-ONLY CROSS BUILDS (aarch64)
  linux-arm64:
    name: Linux aarch64 (cross)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build (cross)
        run: cross build --release --target aarch64-unknown-linux-gnu
      - name: Name the binary for release
        shell: bash
        run: cp "target/aarch64-unknown-linux-gnu/release/${BINARY_NAME}" "${BINARY_NAME}-linux-aarch64"

      - name: Upload binary (linux aarch64)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}-linux-aarch64
          path: ${{ env.BINARY_NAME }}-linux-aarch64
          if-no-files-found: error

  windows-arm64:
    name: Windows aarch64 (cross)
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - name: Build (windows aarch64)
        run: cargo build --release --target aarch64-pc-windows-msvc
      - name: Name the binary for release
        shell: bash
        run: cp "target/aarch64-pc-windows-msvc/release/${BINARY_NAME}.exe" "${BINARY_NAME}-windows-aarch64.exe"

      - name: Upload binary (windows aarch64)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}-windows-aarch64
          path: ${{ env.BINARY_NAME }}-windows-aarch64.exe
          if-no-files-found: error

  release:
    name: Release on tag
    runs-on: ubuntu-latest
    needs:
      - build-test
      - linux-arm64
      - windows-arm64
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts (Rust + Python)
        uses: actions/download-artifact@v8
        with:
          pattern: "*"
          merge-multiple: true

      - name: Create checksums (Rust binaries only)
        if: env.PROJECT_TYPE == 'rust'
        run: |
          shopt -s nullglob
          binaries=("${BINARY_NAME}"-*)
          if [ ${#binaries[@]} -eq 0 ]; then
            echo "No ${BINARY_NAME}-* binaries were downloaded; refusing to publish an empty release." >&2
            ls -R
            exit 1
          fi
          for f in "${binaries[@]}"; do
            sha256sum "$f" > "$f.sha256"
          done
          echo "Release assets:"
          ls -1 "${BINARY_NAME}"-*

      - name: Extract release notes
        id: extract_notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          NUMBER="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          : > release_notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v want="## [$NUMBER]" '
              index($0, want) == 1 { inside = 1; next }
              inside && (/^## / || /^---[[:space:]]*$/) { exit }
              inside { print }
            ' CHANGELOG.md > release_notes.md
          fi
          if [ ! -s release_notes.md ]; then
            git tag -l --format='%(contents)' "$VERSION" > release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: release_notes.md
          files: |
            ${{ env.BINARY_NAME }}-*
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t ${{ env.BINARY_NAME }}:latest \
            --load \
            .

      - name: Smoke test the image
        run: docker run --rm ${{ env.BINARY_NAME }}:latest --version

  publish-docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: release
    # Opt-in: set the repository variable PUBLISH_DOCKER to "true" once
    # DOCKER_USERNAME and DOCKER_PASSWORD secrets exist. Without it a release
    # would fail here on missing credentials.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_DOCKER == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.BINARY_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.BINARY_NAME }}:${{ steps.get_version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
